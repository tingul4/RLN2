# general settings
name: Enhancement_RLN2_CL3AN_Train
model_type: ImageCleanModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100
use_amp: True

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedScene
    baseroot: '/raid/ron/ALN/dataset/CL3AN' # Absolute path as requested
    lphase: 'train'
    geometric_augs: true
    maxsize: 1280
    max_samples: 100 # Limit to 100 images

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 2 # Reduced batch size to ensure it runs
    
    ### -------------Progressive training--------------------------
    # Simplified for small dataset testing
    mini_batch_sizes: [2]             
    iters: [5000]
    gt_size: 384   
    gt_sizes: [384] 
    # ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedScene
    baseroot: '/raid/ron/ALN/dataset/CL3AN'
    lphase: 'test'
    geometric_augs: false
    maxsize: 1080
    max_samples: 10 # Limit val as well for speed
    
# network structures
network_g:
  type: CC36
  num_blocks: 4

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  experiments_root: './experiments/RLN2_CL3AN_Train'
  visualization: './experiments/RLN2_CL3AN_Train/visualization'

# training settings
train:
  total_iter: 5000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [5000]       
    restart_weights: [1]
    eta_mins: [0.000001]   
  
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: Adam
    lr: !!float 2e-4
    betas: [0.9, 0.999]
  
  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 4
  val_freq: !!float 500
  save_img: true
  rgb2bgr: true
  use_image: false
  max_minibatch: 1

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1000
  use_tb_logger: true
  wandb:
    project: low_light_rln2_test
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29800
